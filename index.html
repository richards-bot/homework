<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Nunito', sans-serif;
  background: #f5f0e8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 20px;
  overflow-x: hidden;
}

#homework-due {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(3rem, 10vw, 7rem);
  color: #cc0000;
  text-shadow: 4px 4px 0px #880000;
  animation: pulse 1s ease-in-out infinite;
  text-align: center;
  margin-bottom: 10px;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

#arrow-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 20px 0;
}
#arrow {
  font-size: 4rem;
  animation: bounce 0.7s ease-in-out infinite alternate;
}
@keyframes bounce {
  from { transform: translateX(0); }
  to { transform: translateX(12px); }
}

#ai-logo {
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: transform 0.2s;
  user-select: none;
}
#ai-logo:hover { transform: scale(1.08); }
#ai-logo svg { filter: drop-shadow(0 4px 12px rgba(80,80,255,0.4)); }
#ai-logo-label {
  font-family: 'Fredoka One', cursive;
  font-size: 1.3rem;
  color: #5533ff;
  letter-spacing: 2px;
}

#worksheet {
  background: white;
  border: 3px solid #ccc;
  border-radius: 12px;
  padding: 24px 32px;
  width: min(520px, 95vw);
  margin: 24px 0;
  box-shadow: 4px 4px 0 #ccc;
}
#worksheet h2 {
  font-family: 'Fredoka One', cursive;
  font-size: 1.4rem;
  color: #333;
  margin-bottom: 18px;
  border-bottom: 2px dashed #ccc;
  padding-bottom: 8px;
}
.question {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  font-size: 1.15rem;
  font-weight: 700;
  color: #222;
}
.question-text {
  min-width: 200px;
}
.answer-box {
  width: 90px;
  border: 2px solid #999;
  border-radius: 6px;
  background: #fafafa;
  font-size: 1.1rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  color: #222;
  padding: 4px 8px;
  text-align: center;
  transition: border-color 0.2s, background 0.2s;
}
.answer-box:focus {
  outline: none;
  border-color: #5533ff;
  background: #f0eeff;
}
.answer-box.correct {
  border-color: #22aa44;
  background: #e8ffee;
  color: #22aa44;
}
.answer-box.wrong {
  border-color: #cc0000;
  background: #fff0f0;
  color: #cc0000;
}
.answer-box.ai-filled {
  color: #5533ff;
  border-color: #5533ff;
  background: #f0eeff;
}

.tick { color: #22aa44; font-size: 1.3rem; display: none; }
.cross { color: #cc0000; font-size: 1.3rem; display: none; }

#ai-thinking {
  display: none;
  text-align: center;
  margin: 10px 0;
  font-size: 1.1rem;
  color: #5533ff;
  font-weight: 700;
}
#ai-thinking.show { display: block; }
.dots::after {
  content: '';
  animation: dotdotdot 1.2s steps(4, end) infinite;
}
@keyframes dotdotdot {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

#check-btn {
  background: #5533ff;
  color: white;
  font-family: 'Fredoka One', cursive;
  font-size: 1.3rem;
  border: none;
  border-radius: 10px;
  padding: 12px 28px;
  cursor: pointer;
  box-shadow: 0 4px 0 #3311cc;
  transition: transform 0.1s, box-shadow 0.1s;
  margin: 8px 0 4px;
}
#check-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #3311cc; }
#check-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #3311cc; }

#result-msg {
  font-family: 'Fredoka One', cursive;
  font-size: 1.2rem;
  margin: 8px 0;
  min-height: 1.5rem;
  text-align: center;
}

/* ===== TEACHER ===== */
#teacher-section {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-top: 20px;
  animation: fadeIn 0.5s ease;
}
#teacher-section.show { display: flex; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
#teacher-label {
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  color: #555;
  margin-bottom: -8px;
}
#teacher-svg { cursor: pointer; transition: transform 0.2s; }
#teacher-svg:hover { transform: scale(1.06); }
#click-hint { font-size: 0.95rem; color: #888; font-style: italic; margin-top: -8px; }

#handin-btn {
  display: none;
  background: #22aa44;
  color: white;
  font-family: 'Fredoka One', cursive;
  font-size: 1.4rem;
  border: none;
  border-radius: 12px;
  padding: 14px 32px;
  cursor: pointer;
  box-shadow: 0 4px 0 #166630;
  transition: transform 0.1s, box-shadow 0.1s;
  animation: fadeIn 0.4s ease;
}
#handin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #166630; }
#handin-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #166630; }
#handin-btn.show { display: block; }

#speech-bubble {
  display: none;
  position: relative;
  background: #fff8dc;
  border: 3px solid #e6c800;
  border-radius: 16px;
  padding: 16px 24px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.5rem;
  color: #333;
  text-align: center;
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  max-width: 340px;
}
#speech-bubble.show { display: block; }
#speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  border: 10px solid transparent;
  border-top-color: #e6c800;
}
@keyframes popIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

#reward {
  display: none;
  font-size: 5rem;
  animation: rewardBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
#reward.show { display: block; }
@keyframes rewardBounce {
  from { transform: scale(0) rotate(-30deg); opacity: 0; }
  to { transform: scale(1) rotate(0deg); opacity: 1; }
}

#reset-btn {
  margin-top: 40px;
  background: #888;
  color: white;
  font-family: 'Fredoka One', cursive;
  font-size: 1.2rem;
  border: none;
  border-radius: 10px;
  padding: 12px 28px;
  cursor: pointer;
  box-shadow: 0 4px 0 #555;
  transition: transform 0.1s;
}
#reset-btn:hover { transform: translateY(-2px); }
#reset-btn:active { transform: translateY(2px); }
</style>
</head>
<body>

<div id="homework-due">📚 HOMEWORK DUE! 📚</div>

<div style="font-family:'Fredoka One',cursive; font-size:clamp(1.2rem,4vw,1.8rem); color:#22aa44; text-align:center; margin: 6px 0 2px; text-shadow: 2px 2px 0 #116622;">
  🧠 Use your brain — you've got this!
</div>
<div style="font-size:1rem; color:#666; text-align:center; margin-bottom:16px;">Answer the questions below. Mr. Amin is watching. 👀</div>

<div id="ai-section" style="margin: 0 0 16px; text-align:center;">
  <div style="font-size:0.85rem; color:#aaa; margin-bottom:6px;">⚠️ Only for if you're completely stuck (Mr. Amin will know)</div>
  <div id="ai-logo" onclick="startAI()" style="display:inline-flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; opacity:0.55; filter:grayscale(0.4); transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.06)'" onmouseout="this.style.transform='scale(1)'">
    <svg width="60" height="60" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
      <circle cx="45" cy="45" r="42" fill="#1a1a2e" stroke="#5533ff" stroke-width="3"/>
      <text x="45" y="52" text-anchor="middle" font-size="36" fill="#00eaff">🤖</text>
      <circle r="5" fill="#ff44aa">
        <animateMotion dur="2s" repeatCount="indefinite" path="M 45 8 A 37 37 0 1 1 44.9 8"/>
      </circle>
    </svg>
    <div style="font-family:'Fredoka One',cursive; font-size:1rem; color:#aaa; letter-spacing:2px;">A·I·™</div>
  </div>
</div>

<div id="ai-thinking"><span class="dots">🤔 Calculating</span></div>

<div id="worksheet">
  <h2>📝 Maths Homework — Year 7</h2>
  <div id="questions-container"></div>
  <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:8px;">
    <button id="check-btn" onclick="checkAnswers()">✅ Check Answers</button>
    <div id="result-msg"></div>
  </div>
</div>

<div id="teacher-section">
  <div id="teacher-label">Hand it to Mr. Amin 👇</div>
  <div id="click-hint">(click him)</div>
  <svg id="teacher-svg" width="130" height="200" viewBox="0 0 130 200" xmlns="http://www.w3.org/2000/svg" onclick="showHandIn()">
    <ellipse cx="65" cy="48" rx="32" ry="30" fill="#1a0a00"/>
    <circle cx="40" cy="32" r="10" fill="#1a0a00"/>
    <circle cx="52" cy="26" r="10" fill="#1a0a00"/>
    <circle cx="65" cy="24" r="10" fill="#1a0a00"/>
    <circle cx="78" cy="26" r="10" fill="#1a0a00"/>
    <circle cx="90" cy="32" r="10" fill="#1a0a00"/>
    <circle cx="38" cy="44" r="9" fill="#1a0a00"/>
    <circle cx="92" cy="44" r="9" fill="#1a0a00"/>
    <ellipse cx="65" cy="58" rx="26" ry="28" fill="#c68642"/>
    <ellipse cx="55" cy="54" rx="5" ry="6" fill="white"/>
    <ellipse cx="75" cy="54" rx="5" ry="6" fill="white"/>
    <ellipse cx="55" cy="55" rx="3.5" ry="4" fill="#2a1000"/>
    <ellipse cx="75" cy="55" rx="3.5" ry="4" fill="#2a1000"/>
    <circle cx="56" cy="53" r="1.2" fill="white"/>
    <circle cx="76" cy="53" r="1.2" fill="white"/>
    <path d="M49 47 Q55 44 61 47" stroke="#1a0a00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M69 47 Q75 44 81 47" stroke="#1a0a00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="65" cy="64" rx="4" ry="3" fill="#b5742e"/>
    <path d="M56 74 Q65 79 74 74" stroke="#8b5e2a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="39" cy="59" rx="5" ry="7" fill="#c68642"/>
    <ellipse cx="91" cy="59" rx="5" ry="7" fill="#c68642"/>
    <rect x="58" y="82" width="14" height="14" rx="4" fill="#c68642"/>
    <path d="M50 88 L58 96 L65 90 L72 96 L80 88" fill="white" stroke="white" stroke-width="1"/>
    <path d="M20 95 Q28 88 50 88 L65 100 L80 88 Q102 88 110 95 L115 185 Q65 195 15 185 Z" fill="#2b2b3b"/>
    <path d="M50 88 L58 96 L65 90" fill="#3d3d52" stroke="#2b2b3b" stroke-width="1"/>
    <path d="M80 88 L72 96 L65 90" fill="#3d3d52" stroke="#2b2b3b" stroke-width="1"/>
    <rect x="58" y="95" width="14" height="28" fill="white"/>
    <path d="M65 96 L61 108 L65 132 L69 108 Z" fill="#cc2200"/>
    <polygon points="65,96 61,108 69,108" fill="#dd3311"/>
    <circle cx="65" cy="138" r="3" fill="#1a1a2a"/>
    <circle cx="65" cy="152" r="3" fill="#1a1a2a"/>
    <path d="M22 95 Q10 115 14 140" stroke="#2b2b3b" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M108 95 Q120 115 116 140" stroke="#2b2b3b" stroke-width="18" fill="none" stroke-linecap="round"/>
    <ellipse cx="14" cy="142" rx="9" ry="9" fill="#c68642"/>
    <ellipse cx="116" cy="142" rx="9" ry="9" fill="#c68642"/>
    <path d="M42 182 Q39 190 38 198" stroke="#1e1e2e" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M88 182 Q91 190 92 198" stroke="#1e1e2e" stroke-width="18" fill="none" stroke-linecap="round"/>
    <ellipse cx="37" cy="199" rx="15" ry="7" fill="#111"/>
    <ellipse cx="93" cy="199" rx="15" ry="7" fill="#111"/>
  </svg>
  <button id="handin-btn" onclick="handIn()">📋 Hand In Homework</button>
</div>

<div id="speech-bubble"></div>
<div id="reward"></div>

<button id="reset-btn" onclick="resetPage()">🔄 Reset</button>

<script>
let questions = [];
let aiUsed = false;
let teacherClicked = false;
let allCorrect = false;

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateQuestions() {
  const types = ['add', 'sub', 'mul', 'div'];
  // Pick 5 question types with at least one of each core type
  const pool = ['add', 'sub', 'mul', 'div', types[rand(0, 3)]];
  // Shuffle
  pool.sort(() => Math.random() - 0.5);

  questions = pool.map(type => {
    let q, a;
    if (type === 'add') {
      const x = rand(10, 500), y = rand(10, 500);
      q = `${x} + ${y}`; a = x + y;
    } else if (type === 'sub') {
      const x = rand(50, 500), y = rand(10, x);
      q = `${x} − ${y}`; a = x - y;
    } else if (type === 'mul') {
      const x = rand(2, 13), y = rand(2, 13);
      q = `${x} × ${y}`; a = x * y;
    } else {
      // Simple division: pick result first, then multiply
      const result = rand(2, 12), divisor = rand(2, 12);
      const dividend = result * divisor;
      q = `${dividend} ÷ ${divisor}`; a = result;
    }
    return { q, a };
  });
}

function renderQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  questions.forEach((item, i) => {
    container.innerHTML += `
      <div class="question">
        <span class="question-text">${i + 1}) ${item.q} =</span>
        <input class="answer-box" id="q${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="?">
        <span class="tick" id="tick${i}">✔</span>
        <span class="cross" id="cross${i}">✘</span>
      </div>`;
  });
}

function startAI() {
  if (aiUsed) return;
  aiUsed = true;
  document.getElementById('ai-logo').style.pointerEvents = 'none';
  document.getElementById('ai-thinking').classList.add('show');
  document.getElementById('check-btn').disabled = true;

  const delays = [400, 800, 1300, 1800, 2300];
  questions.forEach((item, i) => {
    setTimeout(() => {
      const box = document.getElementById(`q${i}`);
      box.classList.add('ai-filled');
      box.value = '';
      const ans = String(item.a);
      let charIdx = 0;
      const t = setInterval(() => {
        box.value += ans[charIdx++];
        if (charIdx >= ans.length) clearInterval(t);
      }, 80);
    }, delays[i]);
  });

  setTimeout(() => {
    document.getElementById('ai-thinking').classList.remove('show');
    document.getElementById('check-btn').disabled = false;
    // Auto-check after AI fills in
    setTimeout(checkAnswers, 400);
  }, 2700);
}

function checkAnswers() {
  let correct = 0;
  questions.forEach((item, i) => {
    const box = document.getElementById(`q${i}`);
    const tick = document.getElementById(`tick${i}`);
    const cross = document.getElementById(`cross${i}`);
    const userVal = parseFloat(box.value.trim());
    if (userVal === item.a) {
      box.classList.remove('wrong'); box.classList.add('correct');
      tick.style.display = 'inline'; cross.style.display = 'none';
      correct++;
    } else if (box.value.trim() !== '') {
      box.classList.remove('correct'); box.classList.add('wrong');
      cross.style.display = 'inline'; tick.style.display = 'none';
    }
  });

  const msg = document.getElementById('result-msg');
  if (correct === questions.length) {
    allCorrect = true;
    msg.textContent = aiUsed ? '✅ All correct!' : '🧠🎉 Amazing — you did it with your own brain!!';
    msg.style.color = '#22aa44';
    msg.style.fontSize = aiUsed ? '1.2rem' : '1.35rem';
    document.getElementById('teacher-section').classList.add('show');
  } else if (correct > 0) {
    msg.textContent = `${correct} / ${questions.length} correct — nearly there, keep thinking! 💪`;
    msg.style.color = '#cc6600';
  } else {
    msg.textContent = `Not quite — have another go, you can do it! 🧠`;
    msg.style.color = '#cc0000';
  }
}

function showHandIn() {
  if (teacherClicked) return;
  teacherClicked = true;
  document.getElementById('click-hint').style.display = 'none';
  document.getElementById('handin-btn').classList.add('show');
}

function handIn() {
  document.getElementById('handin-btn').style.display = 'none';
  const bubble = document.getElementById('speech-bubble');
  const reward = document.getElementById('reward');

  if (!aiUsed) {
    bubble.textContent = '🌟 Brilliant!! You used your own brain — I\'m so proud! 🌟';
    reward.textContent = '🍫🎉';
  } else {
    bubble.textContent = '🙄 Use your brain next time!';
    reward.textContent = '🥕';
  }

  bubble.classList.add('show');
  setTimeout(() => reward.classList.add('show'), 600);
}

function resetPage() {
  aiUsed = false;
  teacherClicked = false;
  allCorrect = false;

  document.getElementById('ai-logo').style.pointerEvents = 'auto';
  document.getElementById('ai-thinking').classList.remove('show');
  document.getElementById('check-btn').disabled = false;
  document.getElementById('result-msg').textContent = '';
  document.getElementById('teacher-section').classList.remove('show');
  document.getElementById('click-hint').style.display = 'block';
  const hb = document.getElementById('handin-btn');
  hb.classList.remove('show'); hb.style.display = '';
  document.getElementById('speech-bubble').classList.remove('show');
  document.getElementById('reward').classList.remove('show');

  generateQuestions();
  renderQuestions();
}

// Init
generateQuestions();
renderQuestions();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Nunito', sans-serif;
  background: #f5f0e8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 20px;
  overflow-x: hidden;
}

/* ===== HOMEWORK DUE ===== */
#homework-due {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(3rem, 10vw, 7rem);
  color: #cc0000;
  text-shadow: 4px 4px 0px #880000;
  animation: pulse 1s ease-in-out infinite;
  text-align: center;
  margin-bottom: 10px;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* ===== ARROW + AI LOGO ===== */
#arrow-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 20px 0;
}
#arrow {
  font-size: 4rem;
  animation: bounce 0.7s ease-in-out infinite alternate;
}
@keyframes bounce {
  from { transform: translateX(0); }
  to { transform: translateX(12px); }
}

#ai-logo {
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: transform 0.2s;
  user-select: none;
}
#ai-logo:hover { transform: scale(1.08); }
#ai-logo svg { filter: drop-shadow(0 4px 12px rgba(80,80,255,0.4)); }
#ai-logo-label {
  font-family: 'Fredoka One', cursive;
  font-size: 1.3rem;
  color: #5533ff;
  letter-spacing: 2px;
}

/* ===== WORKSHEET ===== */
#worksheet {
  background: white;
  border: 3px solid #ccc;
  border-radius: 12px;
  padding: 24px 32px;
  width: min(500px, 95vw);
  margin: 24px 0;
  box-shadow: 4px 4px 0 #ccc;
}
#worksheet h2 {
  font-family: 'Fredoka One', cursive;
  font-size: 1.4rem;
  color: #333;
  margin-bottom: 18px;
  border-bottom: 2px dashed #ccc;
  padding-bottom: 8px;
}
.question {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  font-size: 1.15rem;
  font-weight: 700;
  color: #222;
}
.answer-box {
  flex: 1;
  border: none;
  border-bottom: 2px solid #999;
  background: transparent;
  font-size: 1.15rem;
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  color: #2244cc;
  padding: 2px 6px;
  min-width: 80px;
  transition: color 0.3s;
}
.answer-box.filling {
  color: #2244cc;
  animation: typeBlink 0.15s step-end infinite;
}
@keyframes typeBlink {
  50% { opacity: 0.4; }
}

/* ===== AI THINKING OVERLAY ===== */
#ai-thinking {
  display: none;
  text-align: center;
  margin: 10px 0;
  font-size: 1.1rem;
  color: #5533ff;
  font-weight: 700;
}
#ai-thinking.show { display: block; }
.dots::after {
  content: '';
  animation: dotdotdot 1.2s steps(4, end) infinite;
}
@keyframes dotdotdot {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

/* ===== TEACHER ===== */
#teacher-section {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-top: 20px;
  animation: fadeIn 0.5s ease;
}
#teacher-section.show { display: flex; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

#teacher-label {
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  color: #555;
  margin-bottom: -8px;
}

#teacher-svg {
  cursor: pointer;
  transition: transform 0.2s;
}
#teacher-svg:hover { transform: scale(1.06); }

#handin-btn {
  display: none;
  background: #22aa44;
  color: white;
  font-family: 'Fredoka One', cursive;
  font-size: 1.4rem;
  border: none;
  border-radius: 12px;
  padding: 14px 32px;
  cursor: pointer;
  box-shadow: 0 4px 0 #166630;
  transition: transform 0.1s, box-shadow 0.1s;
  animation: fadeIn 0.4s ease;
}
#handin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #166630; }
#handin-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #166630; }
#handin-btn.show { display: block; }

/* ===== SPEECH BUBBLE ===== */
#speech-bubble {
  display: none;
  position: relative;
  background: #fff8dc;
  border: 3px solid #e6c800;
  border-radius: 16px;
  padding: 16px 24px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.5rem;
  color: #333;
  text-align: center;
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  max-width: 340px;
}
#speech-bubble.show { display: block; }
#speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  border: 10px solid transparent;
  border-top-color: #e6c800;
}
@keyframes popIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* ===== CARROT ===== */
#carrot {
  display: none;
  font-size: 5rem;
  animation: carrotBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, spin 1s ease 0.6s forwards;
}
#carrot.show { display: block; }
@keyframes carrotBounce {
  from { transform: scale(0) rotate(-30deg); opacity: 0; }
  to { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes spin {
  0% { transform: rotate(0); }
  25% { transform: rotate(20deg); }
  75% { transform: rotate(-20deg); }
  100% { transform: rotate(0); }
}

#click-hint {
  font-size: 0.95rem;
  color: #888;
  font-style: italic;
  margin-top: -8px;
}
</style>
</head>
<body>

<div id="homework-due">📚 HOMEWORK DUE! 📚</div>

<div id="arrow-row">
  <div id="arrow">👉</div>
  <div id="ai-logo" onclick="startAI()">
    <svg width="90" height="90" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
      <!-- Glowing circle -->
      <circle cx="45" cy="45" r="42" fill="#1a1a2e" stroke="#5533ff" stroke-width="3"/>
      <!-- Brain-like squiggle -->
      <text x="45" y="52" text-anchor="middle" font-size="36" fill="#00eaff">🤖</text>
      <!-- Orbiting dot -->
      <circle r="5" fill="#ff44aa">
        <animateMotion dur="2s" repeatCount="indefinite"
          path="M 45 8 A 37 37 0 1 1 44.9 8"/>
      </circle>
    </svg>
    <div id="ai-logo-label">A·I·™</div>
  </div>
</div>

<div id="ai-thinking"><span class="dots">🤔 Calculating</span></div>

<div id="worksheet">
  <h2>📝 Maths Homework — Year 7</h2>
  <div class="question">1) 247 + 389 = <input class="answer-box" id="q1" readonly placeholder="____"></div>
  <div class="question">2) 15 × 14 = <input class="answer-box" id="q2" readonly placeholder="____"></div>
  <div class="question">3) 864 ÷ 12 = <input class="answer-box" id="q3" readonly placeholder="____"></div>
  <div class="question">4) 1000 − 437 = <input class="answer-box" id="q4" readonly placeholder="____"></div>
  <div class="question">5) 23² = <input class="answer-box" id="q5" readonly placeholder="____"></div>
  <div class="question">6) 3/4 + 1/8 = <input class="answer-box" id="q6" readonly placeholder="____"></div>
</div>

<div id="teacher-section">
  <div id="teacher-label">Hand it to Mr. Amin 👇</div>
  <div id="click-hint">(click him)</div>
  <!-- Teacher SVG: black curly hair, brown skin, suit -->
  <svg id="teacher-svg" width="130" height="200" viewBox="0 0 130 200" xmlns="http://www.w3.org/2000/svg" onclick="showHandIn()">
    <!-- Curly hair (back, black) -->
    <ellipse cx="65" cy="48" rx="32" ry="30" fill="#1a0a00"/>
    <!-- Curly hair bumps -->
    <circle cx="40" cy="32" r="10" fill="#1a0a00"/>
    <circle cx="52" cy="26" r="10" fill="#1a0a00"/>
    <circle cx="65" cy="24" r="10" fill="#1a0a00"/>
    <circle cx="78" cy="26" r="10" fill="#1a0a00"/>
    <circle cx="90" cy="32" r="10" fill="#1a0a00"/>
    <circle cx="38" cy="44" r="9" fill="#1a0a00"/>
    <circle cx="92" cy="44" r="9" fill="#1a0a00"/>
    <!-- Face (slightly brown skin) -->
    <ellipse cx="65" cy="58" rx="26" ry="28" fill="#c68642"/>
    <!-- Eyes -->
    <ellipse cx="55" cy="54" rx="5" ry="6" fill="white"/>
    <ellipse cx="75" cy="54" rx="5" ry="6" fill="white"/>
    <ellipse cx="55" cy="55" rx="3.5" ry="4" fill="#2a1000"/>
    <ellipse cx="75" cy="55" rx="3.5" ry="4" fill="#2a1000"/>
    <circle cx="56" cy="53" r="1.2" fill="white"/>
    <circle cx="76" cy="53" r="1.2" fill="white"/>
    <!-- Eyebrows -->
    <path d="M49 47 Q55 44 61 47" stroke="#1a0a00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M69 47 Q75 44 81 47" stroke="#1a0a00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="65" cy="64" rx="4" ry="3" fill="#b5742e"/>
    <!-- Mouth (neutral/professional) -->
    <path d="M56 74 Q65 79 74 74" stroke="#8b5e2a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Ears -->
    <ellipse cx="39" cy="59" rx="5" ry="7" fill="#c68642"/>
    <ellipse cx="91" cy="59" rx="5" ry="7" fill="#c68642"/>
    <!-- Neck -->
    <rect x="58" y="82" width="14" height="14" rx="4" fill="#c68642"/>
    <!-- White shirt collar -->
    <path d="M50 88 L58 96 L65 90 L72 96 L80 88" fill="white" stroke="white" stroke-width="1"/>
    <!-- Suit jacket (dark grey) -->
    <path d="M20 95 Q28 88 50 88 L65 100 L80 88 Q102 88 110 95 L115 185 Q65 195 15 185 Z" fill="#2b2b3b"/>
    <!-- Lapels -->
    <path d="M50 88 L58 96 L65 90" fill="#3d3d52" stroke="#2b2b3b" stroke-width="1"/>
    <path d="M80 88 L72 96 L65 90" fill="#3d3d52" stroke="#2b2b3b" stroke-width="1"/>
    <!-- Shirt visible below -->
    <rect x="58" y="95" width="14" height="28" fill="white"/>
    <!-- Tie (red) -->
    <path d="M65 96 L61 108 L65 132 L69 108 Z" fill="#cc2200"/>
    <polygon points="65,96 61,108 69,108" fill="#dd3311"/>
    <!-- Suit buttons -->
    <circle cx="65" cy="138" r="3" fill="#1a1a2a"/>
    <circle cx="65" cy="152" r="3" fill="#1a1a2a"/>
    <!-- Arms -->
    <path d="M22 95 Q10 115 14 140" stroke="#2b2b3b" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M108 95 Q120 115 116 140" stroke="#2b2b3b" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Hands -->
    <ellipse cx="14" cy="142" rx="9" ry="9" fill="#c68642"/>
    <ellipse cx="116" cy="142" rx="9" ry="9" fill="#c68642"/>
    <!-- Legs (dark trousers) -->
    <path d="M42 182 Q39 190 38 198" stroke="#1e1e2e" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M88 182 Q91 190 92 198" stroke="#1e1e2e" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="37" cy="199" rx="15" ry="7" fill="#111"/>
    <ellipse cx="93" cy="199" rx="15" ry="7" fill="#111"/>
  </svg>
  <button id="handin-btn" onclick="handIn()">📋 Hand In Homework</button>
</div>

<div id="speech-bubble">⭐ Well done!! ⭐</div>
<div id="carrot">🥕</div>

<button id="reset-btn" onclick="resetPage()" style="
  margin-top: 40px;
  background: #888;
  color: white;
  font-family: 'Fredoka One', cursive;
  font-size: 1.2rem;
  border: none;
  border-radius: 10px;
  padding: 12px 28px;
  cursor: pointer;
  box-shadow: 0 4px 0 #555;
  transition: transform 0.1s, box-shadow 0.1s;
">🔄 Reset</button>

<script>
const answers = ['636', '210', '72', '563', '529', '7/8'];
const ids = ['q1','q2','q3','q4','q5','q6'];
let aiDone = false;

function startAI() {
  if (aiDone) return;
  document.getElementById('ai-logo').style.pointerEvents = 'none';
  document.getElementById('ai-thinking').classList.add('show');

  // Fill answers one by one over ~3 seconds
  const totalTime = 3000;
  const delays = [400, 800, 1300, 1800, 2300, 2700];

  ids.forEach((id, i) => {
    setTimeout(() => {
      const box = document.getElementById(id);
      box.classList.add('filling');
      box.value = '';
      // Type each character
      const ans = answers[i];
      let charIdx = 0;
      const typeInterval = setInterval(() => {
        box.value += ans[charIdx];
        charIdx++;
        if (charIdx >= ans.length) {
          clearInterval(typeInterval);
          box.classList.remove('filling');
        }
      }, 80);
    }, delays[i]);
  });

  setTimeout(() => {
    document.getElementById('ai-thinking').classList.remove('show');
    document.getElementById('teacher-section').classList.add('show');
    aiDone = true;
  }, totalTime + 300);
}

let teacherClicked = false;
function showHandIn() {
  if (teacherClicked) return;
  teacherClicked = true;
  document.getElementById('click-hint').style.display = 'none';
  document.getElementById('handin-btn').classList.add('show');
}

function handIn() {
  document.getElementById('handin-btn').style.display = 'none';
  document.getElementById('speech-bubble').classList.add('show');
  setTimeout(() => {
    document.getElementById('carrot').classList.add('show');
  }, 600);
}

function resetPage() {
  // Clear answers
  ids.forEach(id => {
    const box = document.getElementById(id);
    box.value = '';
    box.classList.remove('filling');
  });
  // Reset AI
  aiDone = false;
  document.getElementById('ai-logo').style.pointerEvents = 'auto';
  document.getElementById('ai-thinking').classList.remove('show');
  // Reset teacher section
  document.getElementById('teacher-section').classList.remove('show');
  document.getElementById('click-hint').style.display = 'block';
  document.getElementById('handin-btn').classList.remove('show');
  document.getElementById('handin-btn').style.display = '';
  teacherClicked = false;
  // Reset ending
  document.getElementById('speech-bubble').classList.remove('show');
  document.getElementById('carrot').classList.remove('show');
}
</script>
</body>
</html>
